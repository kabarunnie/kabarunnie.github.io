<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan · Kabar Unnie</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F3FF;color:#17102B;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#120B24;color:#F4F0FF}}
  .mark{width:64px;height:64px;border-radius:20px;background:#5B2BD6;color:#FFC83D;display:grid;place-items:center;font:italic 600 30px Georgia,serif;margin:0 auto 18px}
  h1{font-size:24px;margin:0 0 8px}
  a{display:inline-block;margin-top:18px;background:#5B2BD6;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:14px}
</style>
</head>
<body>
<main>
  <div class="mark">U</div>
  <h1>Halaman tidak ditemukan</h1>
  <p>Kabar yang kamu cari sudah pindah atau tidak ada.</p>
  <a id="home" href="./">Kembali ke Kabar Unnie</a>
</main>
<script>
  // Works at https://<user>.github.io/<repo>/ and at a domain root.
  (function () {
    var seg = location.pathname.split("/").filter(Boolean)[0];
    var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    document.getElementById("home").href = base;
  })();
</script>
</body>
</html>
